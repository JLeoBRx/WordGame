<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cryptic Faith — testes do motor</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a1c34;
      color: #fffaf0;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 4px;
    }
    p {
      margin: 0 0 18px;
      color: #d6f5ef;
    }
    .summary {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .summary.ok { background: #19a557; }
    .summary.fail { background: #d2394a; }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .06);
      font-size: 14px;
    }
    li.ok::before { content: '✓  '; color: #4fe08a; font-weight: 700; }
    li.fail::before { content: '✗  '; color: #ef5b5b; font-weight: 700; }
    li small {
      display: block;
      margin-top: 4px;
      color: #ff9c9c;
    }
    a { color: #ffd982; }
  </style>
</head>
<body>
  <main>
    <h1>Testes do motor do criptograma</h1>
    <p>Verificam a cifra, os acentos, os erros, a vitória e o texto do Catecismo. <a href="../index.html">Voltar ao jogo</a></p>
    <div id="summary" class="summary">Rodando…</div>
    <ul id="results"></ul>
  </main>

  <script src="../js/cryptogram.js"></script>
  <script src="../js/levels.js"></script>
  <script src="cryptogram.test.js"></script>
  <script>
    (function () {
      var results = window.CF_TEST_RESULTS || [];
      var list = document.getElementById('results');
      var failed = 0;
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'ok' : 'fail';
        li.textContent = r.name;
        if (!r.ok) {
          failed++;
          var small = document.createElement('small');
          small.textContent = r.error;
          li.appendChild(small);
        }
        list.appendChild(li);
      });
      var summary = document.getElementById('summary');
      summary.textContent = (results.length - failed) + ' de ' + results.length + ' testes passaram';
      summary.className = 'summary ' + (failed ? 'fail' : 'ok');
    })();
  </script>
</body>
</html>
